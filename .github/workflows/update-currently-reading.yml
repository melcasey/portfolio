name: Update currently reading

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      # Only need tsx + fast-xml-parser to hit the Goodreads RSS feed.
      # --ignore-scripts skips Astro/sharp native installs that are unused here
      # and were failing this job before the fetch step could run.
      - name: Install dependencies
        run: npm ci --ignore-scripts --include=dev
        env:
          NODE_ENV: development

      - name: Fetch Goodreads shelf
        run: npm run fetch:reading

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/currently-reading.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update currently reading from Goodreads"
            git push
          fi
