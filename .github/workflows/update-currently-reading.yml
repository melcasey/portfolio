name: Update currently reading

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch Goodreads shelf
        run: npx tsx scripts/fetch-currently-reading.ts

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/currently-reading.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update currently reading from Goodreads [skip ci]"
            git push
          fi
